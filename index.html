<!doctype html>
<html lang="en">
<head>

<title>Siege &amp; Shatter</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700;800&display=swap');
:root{color-scheme:dark;--ink:#f4f3ef;--muted:#a3afbf;--line:#ffffff1a;--gold:#ffcc70;--panel:#17243a}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#101a2d;color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;display:flex;align-items:center;justify-content:center;padding:22px;background-image:radial-gradient(ellipse at 46% -10%,#2c4667 0%,transparent 55%),linear-gradient(145deg,#111c30,#101827 70%)}
.game{width:min(1120px,100%);}.topbar{display:flex;align-items:center;justify-content:space-between;margin:0 2px 15px;gap:14px}.brand{display:flex;align-items:center;gap:13px}.brandmark{width:44px;height:44px;border-radius:14px;background:#ffcc70;display:grid;place-items:center;box-shadow:0 5px 22px #ffbd5030}.brandmark svg{width:27px}.eyebrow{font:500 10px 'DM Mono',monospace;text-transform:uppercase;letter-spacing:2px;color:var(--gold);margin-bottom:2px}.title{font-size:21px;font-weight:800;letter-spacing:-.7px}.stats{display:flex;align-items:center;gap:9px}.pill{height:39px;border:1px solid var(--line);border-radius:11px;padding:0 13px;display:flex;gap:8px;align-items:center;background:#ffffff08;color:var(--muted);font-size:12px}.pill strong{color:var(--ink);font:500 13px 'DM Mono',monospace}.pill .icon{color:var(--gold);font-size:15px}.stage-wrap{position:relative;overflow:hidden;border:1px solid #ffffff20;border-radius:17px;background:#8db6ce;box-shadow:0 22px 65px #0005,0 2px 0 #ffffff0d inset}.stage{display:block;width:100%;height:auto;touch-action:none;cursor:crosshair}.banner{position:absolute;top:17px;left:18px;pointer-events:none}.leveltag{display:inline-flex;align-items:center;gap:8px;padding:8px 11px;background:#101b2bc9;border:1px solid #ffffff25;border-radius:9px;font:500 11px 'DM Mono',monospace;color:#e8eff3;backdrop-filter:blur(8px)}.leveltag i{width:7px;height:7px;background:#a9e3b2;border-radius:50%;box-shadow:0 0 10px #8fdb9b}.message{position:absolute;top:18px;left:50%;transform:translateX(-50%);padding:9px 16px;border-radius:9px;background:#152239db;border:1px solid #ffffff20;color:#fff4d8;font-size:12px;font-weight:600;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .2s}.message.show{opacity:1}.bottom{display:grid;grid-template-columns:1fr auto;align-items:center;gap:14px;margin-top:12px}.hint{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:12px}.hint b{color:#e8edf2;font-weight:600}.key{padding:4px 7px;border:1px solid #ffffff25;border-radius:5px;background:#ffffff08;color:#d9e1eb;font:10px 'DM Mono',monospace}.controls{display:flex;gap:8px}.btn{border:1px solid #ffffff22;background:#ffffff09;color:#e4e9ef;border-radius:9px;padding:9px 13px;font:600 11px 'DM Sans',sans-serif;cursor:pointer;transition:.18s}.btn:hover{background:#ffffff17;border-color:#ffffff44;transform:translateY(-1px)}.btn.primary{border:0;background:var(--gold);color:#32240e;padding:10px 16px}.btn.primary:hover{background:#ffdb95}.progress{height:3px;background:#ffffff10;border-radius:4px;margin-top:13px;overflow:hidden}.progress span{display:block;width:0;height:100%;background:var(--gold);transition:width .35s}.footer{display:flex;justify-content:space-between;color:#8090a4;font:10px 'DM Mono',monospace;margin:8px 2px 0}.sound{color:#adbac8}
@media(max-width:650px){body{padding:12px 10px;align-items:center}.topbar{margin-bottom:10px}.brandmark{width:38px;height:38px}.title{font-size:17px}.eyebrow{font-size:9px}.stats{gap:5px}.pill{height:34px;padding:0 8px;font-size:10px}.pill strong{font-size:11px}.banner{top:9px;left:9px}.leveltag{font-size:9px;padding:6px 8px}.message{top:47px;font-size:10px}.bottom{grid-template-columns:1fr;gap:10px;margin-top:9px}.hint{font-size:10px;flex-wrap:wrap;gap:6px}.controls{justify-content:space-between}.btn{padding:9px 10px}.btn.primary{padding:10px 13px}.footer{font-size:9px}}
</style>
</head>
<body>
<main class="game">
 <header class="topbar">
  <div class="brand"><div class="brandmark"><svg viewBox="0 0 28 28" fill="none"><path d="M5 22h19M8 21V13h7l4 4v4M10 13l-2-5 10-3 2 7" stroke="#392b16" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="11" cy="21" r="2" fill="#392b16"/><circle cx="20" cy="21" r="2" fill="#392b16"/></svg></div><div><div class="eyebrow">A tiny siege adventure</div><div class="title">Siege <span style="color:var(--gold)">&amp;</span> Shatter</div></div></div>
  <div class="stats"><div class="pill"><span class="icon">◆</span><strong id="score">0000</strong><span>score</span></div><div class="pill"><span class="icon">●</span><strong id="ammo">8</strong><span>shots</span></div></div>
 </header>
 <div class="stage-wrap"><canvas class="stage" id="game" width="1000" height="560" aria-label="Cannon game. Drag to aim and release to shoot"></canvas><div class="banner"><span class="leveltag"><i></i><span id="level">01</span> &nbsp;·&nbsp; <span id="levelname">THE OLD WATCHTOWER</span></span></div><div class="message" id="message"></div></div>
 <div class="bottom"><div class="hint"><span class="key">DRAG</span><span><b>Aim</b> your cannon</span><span class="key">RELEASE</span><span>to fire</span><span class="key">R</span><span>restart level</span></div><div class="controls"><button class="btn" id="reset">↺ &nbsp;Restart</button><button class="btn primary" id="next" style="display:none">Next tower &nbsp;→</button></div></div>
 <div class="progress"><span id="progress"></span></div><div class="footer"><span>MAKE EVERY SHOT COUNT</span><span class="sound">WOOD · STONE · GLASS · IRON</span></div>
</main>
<script>
(()=>{
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const W=1000,H=560,ground=480,gravity=680;
const ui={score:document.getElementById('score'),ammo:document.getElementById('ammo'),level:document.getElementById('level'),name:document.getElementById('levelname'),message:document.getElementById('message'),progress:document.getElementById('progress'),next:document.getElementById('next')};
const materials={wood:{fill:'#c47b45',edge:'#81482d',hp:2,weight:1,score:60},stone:{fill:'#aeb9c4',edge:'#6e7c89',hp:4,weight:1.55,score:100},glass:{fill:'#91e5df',edge:'#3b9b9d',hp:1,weight:.65,score:90},iron:{fill:'#647993',edge:'#34465e',hp:5,weight:1.9,score:140}};
const levels=[
 {name:'THE OLD WATCHTOWER',ammo:8,blocks:[['wood',695,438,74,26],['wood',773,438,74,26],['stone',707,406,26,38],['stone',809,406,26,38],['wood',735,396,70,20],['glass',730,365,25,42],['glass',786,365,25,42],['wood',728,338,84,20],['stone',741,308,22,40],['stone',779,308,22,40],['wood',744,280,54,18],['wood',732,254,17,28],['wood',793,254,17,28],['glass',754,245,34,14]],targets:[[768,425],[768,324],[768,260]]},
 {name:'THE BRIDGE OF GLASS',ammo:9,blocks:[['stone',672,438,74,26],['stone',750,438,74,26],['stone',828,438,74,26],['wood',687,408,20,34],['wood',809,408,20,34],['glass',710,405,96,16],['iron',719,376,17,39],['iron',780,376,17,39],['wood',744,367,32,14],['glass',703,347,110,15],['stone',720,317,22,42],['stone',780,317,22,42],['wood',738,307,47,18],['glass',749,278,25,42],['wood',730,251,64,18]],targets:[[766,425],[766,390],[766,333],[766,283]]},
 {name:'FORT IRONCLAD',ammo:10,blocks:[['stone',665,438,82,26],['stone',751,438,82,26],['stone',837,438,82,26],['iron',678,405,22,39],['iron',811,405,22,39],['wood',702,405,105,19],['wood',758,382,22,32],['stone',693,373,22,36],['stone',793,373,22,36],['wood',711,362,85,18],['glass',701,335,19,34],['glass',786,335,19,34],['iron',723,333,62,18],['stone',709,305,23,37],['stone',786,305,23,37],['wood',728,295,62,17],['wood',743,267,32,38],['iron',727,250,65,17],['glass',750,221,20,31]],targets:[[790,425],[770,388],[750,342],[755,278],[760,228]]}
];
let levelIndex=0,score=0,ammo=8,blocks=[],targets=[],balls=[],particles=[],aiming=false,pointer=null,aimPoint=null,shake=0,won=false,lost=false,toastTimer=0,last=0,levelScore=0,hasImpact=false;
const cannon={x:112,y:453},clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function makeBlock(row){const [mat,x,y,w,h]=row,m=materials[mat];return {mat,x,y:y+29,w,h,hp:m.hp,maxHp:m.hp,vx:0,vy:0,angle:0,av:0,active:false,gone:false,sleep:0};}
function loadLevel(i){levelIndex=i%levels.length;const l=levels[levelIndex];blocks=l.blocks.map(makeBlock);targets=l.targets.map(([x,y])=>({x,y:y+29,r:9,alive:true}));ammo=l.ammo;balls=[];particles=[];won=false;lost=false;levelScore=0;shake=0;hasImpact=false;aiming=false;ui.level.textContent=String(levelIndex+1).padStart(2,'0');ui.name.textContent=l.name;ui.ammo.textContent=ammo;ui.next.style.display='none';ui.progress.style.width=(levelIndex/levels.length*100)+'%';showToast('Drag back to aim · release to fire',2200);}
function showToast(t,ms=1500){ui.message.textContent=t;ui.message.classList.add('show');toastTimer=ms/1000;}
function updateUI(){ui.score.textContent=String(score).padStart(4,'0');ui.ammo.textContent=ammo;}
function addBurst(x,y,color,n=12,power=180){for(let i=0;i<n;i++){let a=Math.random()*Math.PI*2,s=50+Math.random()*power;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-35,life:.45+Math.random()*.55,max:1,size:2+Math.random()*4,color,rot:Math.random()*6});}}
function shoot(p){if(ammo<=0||won||lost)return;const dx=cannon.x-p.x,dy=cannon.y-p.y;let len=Math.hypot(dx,dy);if(len<12)return;let power=clamp(len,45,190),s=power*6.4,angle=Math.atan2(dy,dx);angle=clamp(angle,-1.23,.16);balls.push({x:cannon.x+Math.cos(angle)*39,y:cannon.y-Math.sin(angle)*39,vx:Math.cos(angle)*s,vy:-Math.sin(angle)*s,r:10,life:5});ammo--;updateUI();}
function worldPos(e){let r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height};}
canvas.addEventListener('pointerdown',e=>{if(won||lost)return;const p=worldPos(e);if(p.x<250&&Math.hypot(p.x-cannon.x,p.y-cannon.y)<190){aiming=true;pointer=e.pointerId;canvas.setPointerCapture(pointer);aimPoint=p;e.preventDefault();}});
canvas.addEventListener('pointermove',e=>{if(aiming&&e.pointerId===pointer){aimPoint=worldPos(e);}});
canvas.addEventListener('pointerup',e=>{if(aiming&&e.pointerId===pointer){let p=worldPos(e);shoot(p);aiming=false;pointer=null;aimPoint=null;}});
canvas.addEventListener('pointercancel',()=>{aiming=false;pointer=null;});
document.getElementById('reset').onclick=()=>loadLevel(levelIndex);ui.next.onclick=()=>loadLevel(levelIndex+1);window.addEventListener('keydown',e=>{if(e.key.toLowerCase()==='r')loadLevel(levelIndex);if(e.key===' '&&won)loadLevel(levelIndex+1);});
function rectHit(b,x,y,r){let cx=clamp(x,b.x-b.w/2,b.x+b.w/2),cy=clamp(y,b.y-b.h/2,b.y+b.h/2);return (x-cx)**2+(y-cy)**2<r*r;}
function hitBlock(ball,b){if(b.gone)return false;const ca=Math.cos(b.angle),sa=Math.sin(b.angle),dx=ball.x-b.x,dy=ball.y-b.y;let lx=dx*ca+dy*sa,ly=-dx*sa+dy*ca;if(!rectHit({x:0,y:0,w:b.w,h:b.h},lx,ly,ball.r))return false;
 let mat=materials[b.mat];hasImpact=true;b.hp--;b.active=true;let nX=Math.sign(lx)||1,nY=Math.sign(ly)||-1;let impulse=Math.min(480,Math.hypot(ball.vx,ball.vy)*.38);b.vx+=ball.vx*.12+ nX*impulse*.15;b.vy+=ball.vy*.10-impulse*.25;b.av+=(Math.random()-.5)*1.5+nX*.35;
 ball.vx*=.57;ball.vy*=.57;ball.x+=nX*5;ball.y+=nY*5;shake=Math.min(8,shake+3.4);addBurst(ball.x,ball.y,mat.fill,7,90);
 if(b.hp<=0){b.gone=true;levelScore+=mat.score;score+=mat.score;addBurst(b.x,b.y,mat.fill,17,210);updateUI();}return true;}
function damageTarget(t){if(!t.alive)return;t.alive=false;levelScore+=250;score+=250;addBurst(t.x,t.y,'#ffd174',24,250);showToast('Target down! +250',850);updateUI();}
function activateCollapse(){if(!hasImpact)return;for(const b of blocks){if(b.gone||b.active)continue;let supported=b.y+b.h/2>=ground-1;for(const o of blocks){if(o===b||o.gone)continue;let vertical=o.y-o.h/2-(b.y+b.h/2);if(vertical>=-2&&vertical<4&&Math.abs(o.x-b.x)<(o.w+b.w)/2-5){supported=true;break;}}
 if(!supported){b.active=true;b.vy=2;}}}
function update(dt){dt=Math.min(dt,.033);if(toastTimer>0){toastTimer-=dt;if(toastTimer<=0)ui.message.classList.remove('show');}shake=Math.max(0,shake-dt*18);
 for(const ball of balls){ball.vy+=gravity*dt;ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;ball.life-=dt;
  for(const t of targets){if(t.alive&&Math.hypot(ball.x-t.x,ball.y-t.y)<ball.r+t.r){damageTarget(t);ball.vx*=.65;ball.vy*=.65;}}
  for(const b of blocks){if(hitBlock(ball,b))break;}
  if(ball.y+ball.r>=ground){ball.y=ground-ball.r;ball.vy*=-.34;ball.vx*=.72;if(Math.abs(ball.vy)<70)ball.vy=0;}
 }
 balls=balls.filter(b=>b.life>0&&b.x<1050&&b.y<620&&b.x>-60);
 activateCollapse();
 for(const b of blocks){if(b.gone)continue;if(b.active){b.vy+=gravity*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;b.angle+=b.av*dt;b.vx*=Math.pow(.985,dt*60);b.av*=Math.pow(.985,dt*60);
  if(b.y+b.h/2>ground){b.y=ground-b.h/2;if(Math.abs(b.vy)>55){b.vy*=-.20;b.av+=(Math.random()-.5)*.24;}else{b.vy=0;b.vx*=.86;b.av*=.82;if(Math.abs(b.vx)<4&&Math.abs(b.av)<.08)b.sleep+=dt;}}
  for(const o of blocks){if(o===b||o.gone||o.active)continue;if(Math.abs(b.x-o.x)<(b.w+o.w)/2-5&&b.y+b.h/2>o.y-o.h/2&&b.y<o.y+o.h/2&&b.vy>0){b.y=o.y-o.h/2-b.h/2;b.vy*=-.16;b.vx+=o.vx*.18;}}
  if(b.x>W+100||b.x<-100||b.y>H+100)b.gone=true;
 }}
 for(const p of particles){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=gravity*.45*dt;p.vx*=.985;p.rot+=dt*4;}particles=particles.filter(p=>p.life>0);
 const standing=blocks.some(b=>!b.gone&&b.y<ground-60&&b.x>630&&b.x<940);
 if(!won&&targets.every(t=>!t.alive)&&!standing){won=true;ui.next.style.display='block';ui.progress.style.width=((levelIndex+1)/levels.length*100)+'%';showToast('Tower shattered! Beautiful shot.',3000);}
 if(!won&&!lost&&ammo===0&&balls.length===0){lost=true;showToast('Out of shots — give it another go!',2500);}
}
function rounded(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);}
function drawBackground(){let sky=ctx.createLinearGradient(0,0,0,ground);sky.addColorStop(0,'#83adc5');sky.addColorStop(.64,'#c7d7d4');sky.addColorStop(1,'#e9d8bd');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
 // soft distant sun
 let sun=ctx.createRadialGradient(738,108,8,738,108,70);sun.addColorStop(0,'#fff5d6b8');sun.addColorStop(1,'#fff5d600');ctx.fillStyle=sun;ctx.fillRect(650,20,180,180);ctx.fillStyle='#ffedc5';ctx.beginPath();ctx.arc(738,108,22,0,Math.PI*2);ctx.fill();
 // distant hills
 ctx.fillStyle='#90b2ad';ctx.beginPath();ctx.moveTo(0,368);ctx.quadraticCurveTo(95,286,196,349);ctx.quadraticCurveTo(294,397,399,317);ctx.quadraticCurveTo(487,270,589,354);ctx.lineTo(680,385);ctx.lineTo(0,430);ctx.fill();
 ctx.fillStyle='#779c98';ctx.beginPath();ctx.moveTo(270,402);ctx.quadraticCurveTo(398,316,512,370);ctx.quadraticCurveTo(617,416,713,326);ctx.quadraticCurveTo(819,286,1000,375);ctx.lineTo(1000,470);ctx.lineTo(270,470);ctx.fill();
 // clouds
 ctx.fillStyle='#f0f4e978';for(const [x,y,s] of [[144,112,1],[438,82,.7],[876,192,.65]]){ctx.beginPath();ctx.ellipse(x,y,38*s,8*s,0,0,Math.PI*2);ctx.ellipse(x-19*s,y-5*s,16*s,11*s,0,0,Math.PI*2);ctx.ellipse(x+3*s,y-8*s,22*s,14*s,0,0,Math.PI*2);ctx.ellipse(x+23*s,y-3*s,17*s,10*s,0,0,Math.PI*2);ctx.fill();}
 // back little trees
 for(const [x,y,s] of [[54,410,.75],[142,411,.55],[927,413,.72],[965,414,.55]]){ctx.fillStyle='#657f6e';ctx.fillRect(x-4*s,y-40*s,8*s,42*s);ctx.fillStyle='#55776e';for(let j=0;j<3;j++){ctx.beginPath();ctx.arc(x+(j-1)*11*s,y-42*s-j*11*s,18*s,0,Math.PI*2);ctx.fill();}}
 // ground
 let g=ctx.createLinearGradient(0,ground,0,H);g.addColorStop(0,'#6d8d62');g.addColorStop(.16,'#506c4e');g.addColorStop(1,'#354e40');ctx.fillStyle=g;ctx.fillRect(0,ground,W,H-ground);ctx.fillStyle='#a5b784';ctx.fillRect(0,ground,W,4);
 // terrain tiny flecks
 for(let i=0;i<42;i++){let x=(i*173+31)%W,y=490+(i*47)%65;ctx.fillStyle=i%2?'#9aaa6d33':'#d7c69826';ctx.fillRect(x,y,9+(i%5)*3,1.5);}
 // launch platform
 ctx.fillStyle='#405a51';rounded(55,ground-13,134,17,5);ctx.fill();ctx.fillStyle='#759174';ctx.fillRect(57,ground-13,130,3);
}
function drawBlock(b){if(b.gone)return;const m=materials[b.mat];ctx.save();ctx.translate(b.x,b.y);ctx.rotate(b.angle);ctx.shadowColor='#172b293d';ctx.shadowBlur=6;ctx.shadowOffsetY=3;
 rounded(-b.w/2,-b.h/2,b.w,b.h,Math.min(5,b.h/3));ctx.fillStyle=m.fill;ctx.fill();ctx.shadowColor='transparent';ctx.lineWidth=1.5;ctx.strokeStyle=m.edge;ctx.stroke();
 // material markings
 if(b.mat==='wood'){ctx.strokeStyle='#e7ae6a76';ctx.lineWidth=1.3;ctx.beginPath();ctx.moveTo(-b.w/2+6,0);ctx.bezierCurveTo(-b.w/5,-4,b.w/7,4,b.w/2-7,-1);ctx.stroke();ctx.fillStyle='#75452c';ctx.beginPath();ctx.arc(-b.w/2+7,0,1.8,0,7);ctx.fill();}
 else if(b.mat==='stone'){ctx.strokeStyle='#edf1f354';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(-b.w/2+5,-b.h/2+6);ctx.lineTo(b.w/2-5,-b.h/2+6);ctx.moveTo(-b.w/2+5,b.h/2-6);ctx.lineTo(b.w/2-5,b.h/2-6);ctx.stroke();}
 else if(b.mat==='glass'){ctx.fillStyle='#effffb65';ctx.beginPath();ctx.moveTo(-b.w/2+4,-b.h/2+3);ctx.lineTo(-b.w/2+10,-b.h/2+3);ctx.lineTo(-b.w/2+4,b.h/2-3);ctx.fill();}
 else{ctx.fillStyle='#cad6e533';ctx.fillRect(-b.w/2+3,-b.h/2+3,b.w-6,3);ctx.fillStyle='#35445c';for(let x=-b.w/2+6;x<b.w/2-3;x+=13){ctx.beginPath();ctx.arc(x,0,1.3,0,7);ctx.fill();}}
 if(b.hp<b.maxHp){ctx.globalAlpha=.6;ctx.strokeStyle='#321e20';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(0,-b.h/2+1);ctx.lineTo(-4,0);ctx.lineTo(2,3);ctx.lineTo(-3,b.h/2-2);ctx.stroke();}
 ctx.restore();}
function drawCannon(){ctx.save();ctx.translate(cannon.x,cannon.y);let angle=-.2;if(aiming&&aimPoint){let dx=cannon.x-aimPoint.x,dy=cannon.y-aimPoint.y;angle=clamp(Math.atan2(dy,dx),-.02,1.23);}ctx.rotate(-angle);
 ctx.fillStyle='#202e3a';ctx.strokeStyle='#111f2a';ctx.lineWidth=3;rounded(-8,-14,48,28,8);ctx.fill();ctx.stroke();let barrel=ctx.createLinearGradient(0,-11,0,11);barrel.addColorStop(0,'#b4c1be');barrel.addColorStop(.35,'#687b7e');barrel.addColorStop(1,'#394d54');ctx.fillStyle=barrel;rounded(7,-12,48,24,7);ctx.fill();ctx.strokeStyle='#263c43';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='#dfb76e';ctx.beginPath();ctx.arc(0,0,17,0,Math.PI*2);ctx.fill();ctx.fillStyle='#4b4d43';ctx.beginPath();ctx.arc(0,0,10,0,Math.PI*2);ctx.fill();ctx.restore();
 ctx.fillStyle='#293a3b';ctx.beginPath();ctx.arc(cannon.x-7,ground-9,11,0,7);ctx.arc(cannon.x+26,ground-9,11,0,7);ctx.fill();ctx.fillStyle='#b8aa80';ctx.beginPath();ctx.arc(cannon.x-7,ground-9,4,0,7);ctx.arc(cannon.x+26,ground-9,4,0,7);ctx.fill();}
